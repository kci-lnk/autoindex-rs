[package]
name = "autoindex-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A secure, standalone directory index server with GitHub-flavored README rendering"
license = "MIT"

[dependencies]
ammonia = "4.1"
askama = "0.16"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
bytes = "1.10"
cap-std = "4.0"
caseless = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive"] }
comrak = { version = "0.54", default-features = false }
dotenvy = "0.15"
httpdate = "1.0"
lol_html = "3.0"
libc = "0.2"
mime_guess = "2.0"
percent-encoding = "2.3"
same-file = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-general-category = "1.0"
url = "2.5"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.21"

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
